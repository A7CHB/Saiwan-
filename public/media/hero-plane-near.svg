<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 2000 2000" width="2000" height="2000" role="img">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#F3D9AE"/>
      <stop offset="55%" stop-color="#E0AC71"/>
      <stop offset="100%" stop-color="#B87642"/>
    </linearGradient>
    <linearGradient id="fore" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#6E4E33" stop-opacity="0"/>
      <stop offset="55%" stop-color="#6E4E33" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#6E4E33" stop-opacity="0.92"/>
    </linearGradient>
    <linearGradient id="haze" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#E0AC71" stop-opacity="0"/>
      <stop offset="70%" stop-color="#E0AC71" stop-opacity="0.34"/>
      <stop offset="100%" stop-color="#E0AC71" stop-opacity="0"/>
    </linearGradient>
    <filter id="soft"><feGaussianBlur stdDeviation="90.0"/></filter>
    <filter id="far"><feGaussianBlur stdDeviation="7"/></filter>
    <filter id="grain"><feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="3"/></filter></defs>
  
  <rect x="0" y="1600" width="2000" height="1200" fill="url(#fore)"/>
  <rect x="0" y="1600" width="2000" height="2" fill="#FFE3B8" opacity="0.18"/>
</svg>